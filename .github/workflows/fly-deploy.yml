# CI/CD pipeline for ChessCoach.
#
# Deploys the single production tier built from this monorepo:
#
#   Hetzner heavy backend — `cereveon-llm-api` image (Python FastAPI +
#   Stockfish + full SECA pipeline, port 8000), served at cereveon.com
#   behind Caddy.  Updated by the `deploy` job below via SSH + docker
#   compose.
#
# The former Fly.io edge (a Node/Express `cereveon` image running the
# vestigial llm/server.js Ollama prototype) was removed 2026-07-15: it
# never fronted cereveon.com (that has always resolved to Hetzner's
# Caddy directly) and its only endpoints were an unauthenticated,
# validator-bypassing /coach·/explain that 502'd on a non-existent
# Ollama upstream.  See docs/DEPLOYMENT.md.
#
# The workflow's filename is preserved for URL stability across external
# bookmarks; the workflow's `name:` field (CI/CD) is the authoritative
# description.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  API_IMAGE_NAME: cereveon-llm-api

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

  python-tests:
    name: Python tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            llm/requirements.txt
            llm/requirements-ci.txt
            pyproject.toml

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r llm/requirements-ci.txt

      - name: Run golden tests (Category A — mandatory)
        run: python -m pytest -q llm/rag/tests/golden/test_retriever.py llm/rag/tests/golden/test_prompt_snapshot.py

      - name: Run LLM contract tests (Category B — mandatory)
        run: python -m pytest -q llm/rag/tests/contracts/test_fake_llm.py

      - name: Run validator violations corpus (Category B — mandatory)
        run: python -m pytest -q llm/rag/tests/contracts/test_violations_corpus.py

      - name: Run API contract validation
        run: python -m pytest -q llm/tests/test_api_contract_validation.py

      - name: Run coaching pipeline regression tests
        run: python -m pytest -q llm/tests/test_coaching_pipeline_regression.py

      - name: Run explain schema validation tests
        run: python -m pytest -q llm/tests/test_explain_schema_validation.py

      - name: Run engine regression tests
        # The flat ``llm/engine_eval.py`` / ``llm/elite_engine_service.py``
        # modules were retired alongside host_app (PR #111) in the
        # engine-library cleanup; live coverage moved to
        # ``llm.seca.engines.stockfish.pool`` and is exercised by
        # ``test_engine_pool_*.py`` plus the existing response-format
        # / adapter-isolation regressions.
        run: |
          python -m pytest -q --tb=short \
            llm/tests/test_engine_response_format.py \
            llm/tests/test_engine_pool_evaluate_position.py \
            llm/tests/test_engine_pool_exhaustion.py \
            llm/tests/test_engine_pool_crash_recovery.py \
            llm/tests/test_fen_move_cache_key.py \
            llm/tests/test_stockfish_adapter_isolation.py

      - name: Run API security tests
        run: python -m pytest -q --tb=short llm/tests/test_api_security.py

      - name: Run regression pipeline
        run: python llm/run_regression_suite.py

      - name: Run pytest suite with coverage
        run: python llm/run_ci_suite.py

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-artifacts
          path: |
            tmp_logs/coverage.xml
            tmp_logs/pytest-ci.xml

  python-quality:
    name: Black, Pylint, and Mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            llm/requirements.txt
            llm/requirements-ci.txt
            pyproject.toml

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r llm/requirements-ci.txt

      - name: Run Black
        run: python llm/run_quality_gate.py black

      - name: Run Pylint
        run: python llm/run_quality_gate.py pylint

      - name: Run Mypy
        run: python llm/run_quality_gate.py mypy

  dependency-security:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            llm/requirements.txt
            llm/requirements-ci.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.8.0

      - name: Audit runtime dependencies
        # PYSEC-2025-183 / CVE-2025-45768 is a DISPUTED advisory against
        # pyjwt: it flags "weak encryption", but the upstream maintainer
        # rejects the report because key length is application-controlled
        # — see the NOTE field at
        # https://api.osv.dev/v1/vulns/PYSEC-2025-183.  Our app already
        # enforces SECRET_KEY length >= 32 chars in prod (validated at
        # module load in llm/seca/auth/tokens.py; documented in
        # .env.example and docs/THREAT_MODEL.md §T2), which is the
        # strong-key property the advisory complains about.  No upstream
        # fix version exists and one is unlikely to ship.  Revisit if
        # pyjwt ever releases a version that explicitly addresses the
        # advisory, or if our SECRET_KEY guarantees change.
        #
        # NOTE: PYSEC-2026-161 / CVE-2026-48710 (starlette "BadHost":
        # missing Host-header validation poisons ``request.url.path`` and
        # can bypass path-based security checks) was previously suppressed
        # here while fastapi 0.128.1 capped ``starlette<0.51.0``.  That cap
        # is gone — fastapi 0.136.3 requires only ``starlette>=0.46.0`` —
        # so the runtime now ships starlette 1.2.1 (past the fixed 1.0.1)
        # and the advisory is closed at the dependency level.  The
        # ``--ignore-vuln`` was therefore removed; if a vulnerable
        # starlette is ever re-pinned, this audit step fails (and so does
        # llm/tests/test_security_host_header_poisoning.py).
        run: python -m pip_audit -r llm/requirements.txt --strict --ignore-vuln PYSEC-2025-183 --progress-spinner off

      - name: Audit CI/toolchain dependencies
        # Only the disputed pyjwt advisory remains suppressed here:
        #   - PYSEC-2025-183 disputed pyjwt advisory + SECRET_KEY
        #     mitigation apply identically (pyjwt is also pulled in
        #     transitively by the CI dependency tree, e.g. test
        #     fixtures that mint tokens against the auth router).
        # PYSEC-2026-161 (starlette BadHost) is no longer suppressed:
        # requirements-ci.txt installs the same starlette 1.2.1 as the
        # runtime via ``-r requirements.txt``, which is past the 1.0.1 fix.
        run: python -m pip_audit -r llm/requirements-ci.txt --strict --ignore-vuln PYSEC-2025-183 --progress-spinner off

  android-build:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle
      ANDROID_USER_HOME: ${{ github.workspace }}/.android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform 36
        run: sdkmanager "platforms;android-36"

      - name: Run Android host JVM unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Generate and validate packaged manifests
        working-directory: android
        run: ./gradlew processDebugManifestForPackage processReleaseManifestForPackage --no-daemon

      - name: Verify packaged manifest includes INTERNET permission
        shell: bash
        run: |
          debug_manifest="android/app/build/intermediates/packaged_manifests/debug/processDebugManifestForPackage/AndroidManifest.xml"
          release_manifest="android/app/build/intermediates/packaged_manifests/release/processReleaseManifestForPackage/AndroidManifest.xml"
          for manifest in "$debug_manifest" "$release_manifest"; do
            test -f "$manifest"
            grep -q 'android.permission.INTERNET' "$manifest"
          done

      # Decode the base64-encoded keystore secret into a temp file.
      # Skipped on PRs: signing is only needed for the artefact produced on push.
      - name: Decode release keystore
        if: github.event_name == 'push'
        id: keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      # Append signing properties to gradle.properties so Gradle picks them up
      # via findProperty(). Secrets are passed as env vars (GitHub masks them in
      # logs); the keystore path is a derived value, not a secret.
      # Skipped entirely when the keystore was not decoded (no KEYSTORE_BASE64).
      - name: Write signing properties
        if: steps.keystore.outputs.available == 'true'
        shell: bash
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          {
            echo "MYAPP_UPLOAD_STORE_FILE=${{ steps.keystore.outputs.path }}"
            echo "MYAPP_UPLOAD_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "MYAPP_UPLOAD_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            echo "MYAPP_UPLOAD_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
          } >> android/gradle.properties

      # COACH_API_BASE is a plain URL (visible in the APK — not a secret).
      # PR builds use dev defaults (no secrets exposed to PR runners).
      # Push builds inject COACH_API_KEY for the production artefact.
      - name: Build release APK (PR)
        if: github.event_name == 'pull_request'
        working-directory: android
        env:
          COACH_API_BASE: ${{ vars.COACH_API_BASE }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release APK (push)
        if: github.event_name == 'push'
        working-directory: android
        env:
          COACH_API_BASE: ${{ vars.COACH_API_BASE }}
          COACH_API_KEY: ${{ secrets.COACH_API_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

  compose-validate:
    name: Validate Compose files and Caddyfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate docker-compose.yml syntax
        run: docker compose config --quiet

      - name: Validate docker-compose.prod.yml syntax
        env:
          DOMAIN: test.example.com
          GHCR_IMAGE: ghcr.io/owner/test:latest
        run: |
          printf '%s\n' \
            'POSTGRES_DB=chesscoach' \
            'POSTGRES_USER=chesscoach' \
            'POSTGRES_PASSWORD=stub' \
            'SECA_ENV=prod' \
            'SECA_API_KEY=stub' \
            'SECRET_KEY=stub' \
            'CORS_ALLOWED_ORIGINS=https://test.example.com' \
            'DATABASE_URL=sqlite:///data/seca.db' \
            'COACH_DEEPSEEK_API_KEY=stub' \
            > .env.prod
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Validate Caddyfile syntax
        run: |
          docker run --rm \
            -e DOMAIN=test.example.com \
            -v "$GITHUB_WORKSPACE/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile > /dev/null

  docker-images:
    name: Build and publish Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - workflow-lint
      - python-tests
      - python-quality
      - dependency-security
      - android-build
      - compose-validate
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_owner: ${{ steps.prep.outputs.owner }}
      api_digest: ${{ steps.build-api.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Normalize image owner
        id: prep
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for llm API image
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.prep.outputs.owner }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=true

      - name: Build llm API image
        id: build-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./llm/Dockerfile.api
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=llm-api-image
          cache-to: type=gha,mode=max,scope=llm-api-image
          provenance: false
          sbom: false
          build-args: BUILDDATE=${{ github.run_id }}

      - name: Attest llm API image provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.prep.outputs.owner }}/${{ env.API_IMAGE_NAME }}
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3

      - name: Sign published image
        if: github.event_name == 'push'
        shell: bash
        run: |
          cosign sign --yes "ghcr.io/${{ steps.prep.outputs.owner }}/${{ env.API_IMAGE_NAME }}@${{ steps.build-api.outputs.digest }}"

  image-security:
    name: Trivy image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - docker-images
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Trivy vulnerability DB
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ runner.os }}-

      - name: Scan published llm API image
        id: trivy-api-image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ needs.docker-images.outputs.image_owner }}/${{ env.API_IMAGE_NAME }}@${{ needs.docker-images.outputs.api_digest }}
          format: table
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivy-config: trivy.yaml
          trivyignores: .trivyignore
          ignore-policy: trivy-ignore-policy.rego
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy
          TRIVY_TIMEOUT: "15m"
          TRIVY_USERNAME: ${{ github.repository_owner }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate llm API image SARIF
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ needs.docker-images.outputs.image_owner }}/${{ env.API_IMAGE_NAME }}@${{ needs.docker-images.outputs.api_digest }}
          format: sarif
          output: trivy-api-image.sarif
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          trivy-config: trivy.yaml
          trivyignores: .trivyignore
          ignore-policy: trivy-ignore-policy.rego
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_TIMEOUT: "15m"
          TRIVY_USERNAME: ${{ github.repository_owner }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload llm API image scan results
        if: hashFiles('trivy-api-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-api-image.sarif
          category: trivy-api-image


  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - workflow-lint
      - python-tests
      - python-quality
      - dependency-security
      - docker-images
      - image-security
      - compose-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment:
      name: production
    concurrency:
      group: hetzner-production
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Hetzner secrets availability
        id: hetzner-check
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          if [ -z "${HETZNER_HOST}" ] || [ -z "${HETZNER_SSH_KEY}" ]; then
            echo "::warning::HETZNER_HOST or HETZNER_SSH_KEY not configured. Skipping Hetzner deploy."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # Sync the deploy-time configs from the just-checked-out commit BEFORE
      # the SSH step runs `docker compose up`.  Without this, the compose
      # file and Caddyfile on /opt/chesscoach/ are whatever was last copied
      # there manually — they don't update with the repo, so every deploy
      # uses a stale topology.  Concrete failure mode: PR #65 dropped the
      # `ollama` service from docker-compose.prod.yml in the repo, but the
      # on-box file still declared it; subsequent `docker compose up` runs
      # silently re-created the orphan ollama container, OOM-cascading the
      # 4 GB box.  Now the deploy is repo-as-source-of-truth: any change
      # to the compose file or Caddyfile is in effect on the next merge.
      # The .env.prod file is intentionally NOT synced — it holds runtime
      # secrets that never live in the repo.
      - name: Sync compose file and Caddyfile to Hetzner
        if: steps.hetzner-check.outputs.available == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile,site"
          target: "/opt/chesscoach"
          overwrite: true

      # Stop-and-replace deploy (single-container).
      #
      # Why not rolling --scale api=2: the 4 GB Hetzner VPS cannot host two
      # api containers in parallel.  Each api uses ~700 MB resident plus a
      # transient peak when the Stockfish engine pool spawns at startup;
      # combined with Postgres (200 MB), Redis (50 MB), and Caddy, the
      # rolling pair pushes past the 3.7 GB limit.  In two consecutive
      # deploys (PR #68 and PR #69) the rolling --scale api=2 strategy
      # OOM-stalled — `docker inspect` on the new container hung under
      # memory pressure, the SSH command_timeout (10 min) fired before the
      # healthcheck loop completed, and the deploy was reported as failed.
      # See feedback memory ‟Hetzner production deploy gotchas” for the
      # full incident timeline.
      #
      # Trade-off: ~5-10 s of 502/503 from Caddy during the swap, in
      # exchange for not OOMing the box.  Acceptable for our traffic
      # profile (Android client retries idempotent GETs; chat POSTs are
      # rare enough that the user-visible cost of one missed request is
      # one offline-template fallback).  Bigger box (CX22, 8 GB) would
      # restore the rolling-pair option — that's a separate followup.
      #
      # Sequence:
      #  1. Record running container's image (rollback reference).
      #  2. Pull the exact digest produced by the docker-images job.
      #  3. --force-recreate api: stop old, remove, create new with new image.
      #     Caddy briefly serves 502 until the new container's healthcheck
      #     passes; total downtime usually 5-10 s.
      #  4. Poll Docker's healthcheck on the new container (up to 90 s).
      #  5a. Healthy → done.
      #  5b. Unhealthy → re-recreate with the previous image.  Adds another
      #      5-10 s of downtime but auto-restores the previous good state.
      - name: Deploy to Hetzner via SSH
        if: steps.hetzner-check.outputs.available == 'true'
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_IMAGE: ghcr.io/${{ needs.docker-images.outputs.image_owner }}/${{ env.API_IMAGE_NAME }}@${{ needs.docker-images.outputs.api_digest }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: deploy
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: DEPLOY_IMAGE
          script: |
            set -euo pipefail
            cd /opt/chesscoach

            # ── 0. Pre-flight: verify required secrets are in .env.prod ───────
            #    The server crashes at module load (not health-check time) when
            #    SECRET_KEY is missing in prod, which causes a silent 90-second
            #    wait before the deploy rolls back.  Fail fast with a clear
            #    message instead.
            for _var in SECA_API_KEY SECRET_KEY SECA_ENV; do
              if ! grep -qE "^${_var}=.+" .env.prod 2>/dev/null; then
                echo "::error::Required variable ${_var} is missing or empty in /opt/chesscoach/.env.prod"
                echo "  Add it:  echo '${_var}=<value>' >> /opt/chesscoach/.env.prod"
                echo "  SECRET_KEY hint:  python3 -c \"import secrets; print(secrets.token_hex(32))\""
                exit 1
              fi
            done

            # ── 1. Record running container's image for rollback ──────────────
            PREV_CONTAINER=$(docker compose -f docker-compose.prod.yml ps -q api 2>/dev/null | head -1 || true)
            PREV_IMAGE=$([ -n "$PREV_CONTAINER" ] && \
              docker inspect --format='{{.Config.Image}}' "$PREV_CONTAINER" 2>/dev/null || true)
            echo "Previous: ${PREV_IMAGE:-none}"
            echo "Deploying: $DEPLOY_IMAGE"

            # ── 2. Pull pinned, CI-signed image by digest ─────────────────────
            docker pull "$DEPLOY_IMAGE"

            # ── 3. Stop-and-replace: tear down old api, bring up new ──────────
            #    --force-recreate stops the existing container, removes it,
            #    and creates a new one with the new image (passed via the
            #    GHCR_IMAGE env var that docker-compose.prod.yml reads).
            #    Brief 502 from Caddy until the new container is healthy.
            GHCR_IMAGE="$DEPLOY_IMAGE" \
              docker compose -f docker-compose.prod.yml up -d --force-recreate api

            # ── 4. Identify the new container ─────────────────────────────────
            NEW_CONTAINER=$(docker compose -f docker-compose.prod.yml ps -q api | head -1 || true)
            if [ -z "$NEW_CONTAINER" ]; then
              echo "::error::No api container present after --force-recreate."
              exit 1
            fi
            echo "New container: $NEW_CONTAINER"

            # ── 5. Wait up to 90 s for Docker healthcheck on new container ────
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$NEW_CONTAINER" 2>/dev/null || echo "unknown")
              [ "$STATUS" = "healthy" ] && break
              echo "  Health.Status: $STATUS ($i/18)"
              sleep 5
            done
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$NEW_CONTAINER" 2>/dev/null || echo "failed")

            # ── 6a. Healthy: deploy done ──────────────────────────────────────
            if [ "$STATUS" = "healthy" ]; then
              echo "Deployment complete."
              # Apply synced Caddyfile + landing-page (site/) changes.  The SCP
              # step above updates them on disk, but the running caddy container
              # only picks up a new volume mount / Caddyfile on recreate.
              # ``up -d caddy`` recreates caddy when its compose config changed
              # (adding the ./site:/srv mount does) and is a no-op otherwise, so
              # it will not blip ingress on ordinary api-only deploys.
              #
              # ``--no-deps`` is REQUIRED: caddy ``depends_on`` api, so without
              # it ``compose up caddy`` also reconciles api and tries to pull the
              # private GHCR api image -- which fails with "error from registry:
              # denied" and silently aborts the caddy recreate (landing page then
              # never goes live).  --no-deps limits the action to caddy, whose
              # public image is already present locally.
              docker compose -f docker-compose.prod.yml up -d --no-deps caddy || true
              # A Caddyfile *content* change (e.g. a new route) does not alter
              # caddy's compose config, so the ``up -d`` above is a no-op for it.
              # Gracefully reload the freshly-synced Caddyfile so routing changes
              # take effect with zero downtime (caddy keeps the running config if
              # the new one fails to validate).
              docker compose -f docker-compose.prod.yml exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile || true
              # Prune stale unused images.  Without this, every merge to main
              # leaves prior cereveon-llm-api digests on disk; on the 38 GB
              # Hetzner box the / volume fills after ~30-50 merges and the
              # next deploy's SCP step fails with the misleading
              # "error copy file to dest: ***" signature (4 consecutive
              # deploys stuck on 2026-05-15 before `docker image prune -af`
              # unblocked it).  See feedback memory "Hetzner production
              # deploy gotchas" #4 for the full incident.
              #
              # --filter "until=72h" keeps the previous deploy's image so a
              # manual rollback skips the GHCR round-trip; -af removes
              # everything else not currently in use (the running api's
              # image is referenced and therefore safe).  Errors do not
              # fail the deploy — `|| true` keeps an otherwise-healthy
              # rollout from being marked failed by a transient docker
              # hiccup during prune.
              docker image prune -af --filter "until=72h" || true
              exit 0
            fi

            # ── 6b. Unhealthy: roll back to the previous image ────────────────
            #    With stop-and-replace there is no surviving old container to
            #    fall back on, so we re-recreate api with the previous image.
            #    This adds another ~5-10 s of downtime, but auto-restores
            #    the previous good state without operator intervention.
            echo "::error::New container unhealthy ($STATUS). Rolling back to ${PREV_IMAGE:-(none)}..."
            if [ -n "${PREV_IMAGE:-}" ]; then
              GHCR_IMAGE="$PREV_IMAGE" \
                docker compose -f docker-compose.prod.yml up -d --force-recreate api
              echo "Rolled back to $PREV_IMAGE."
            else
              echo "::error::No previous image recorded; cannot auto-roll-back.  Investigate manually."
            fi
            exit 1

  llm-regression:
    name: LLM regression and smoke tests (DeepSeek)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Tag pushes only — never on per-push CI per TESTING.md Category D/C.
    # Also runs on workflow_dispatch for ad-hoc pre-release verification.
    # Both gated additionally on the COACH_DEEPSEEK_API_KEY secret being
    # set: without it the job no-ops with a clear log line, so a fork or
    # a repo without DeepSeek billing wired up doesn't spuriously fail
    # the release path.  The secret-presence check is surfaced via a
    # job-level ``env:`` because GitHub Actions disallows
    # ``secrets.X`` directly in step-level ``if:`` expressions (it
    # would create a side-channel oracle for whether a secret exists);
    # using ``env:`` is the documented workaround.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    env:
      HAS_DEEPSEEK_KEY: ${{ secrets.COACH_DEEPSEEK_API_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            llm/requirements.txt
            llm/requirements-ci.txt
            pyproject.toml

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r llm/requirements-ci.txt

      - name: Skip if COACH_DEEPSEEK_API_KEY is unset
        if: env.HAS_DEEPSEEK_KEY != 'true'
        run: |
          echo "::warning::COACH_DEEPSEEK_API_KEY secret is not set; skipping LLM regression and smoke tests."
          echo "To enable them, set COACH_DEEPSEEK_API_KEY in repo secrets (Settings → Secrets and variables → Actions)."

      - name: Run LLM regression tests (RELEASE.md Step 3)
        if: env.HAS_DEEPSEEK_KEY == 'true'
        env:
          RUN_DEEPSEEK_TESTS: "1"
          COACH_DEEPSEEK_API_KEY: ${{ secrets.COACH_DEEPSEEK_API_KEY }}
        run: python -m pytest -q llm/rag/tests/llm/test_llm_regression.py

      - name: Run DeepSeek smoke test (RELEASE.md Step 4)
        if: env.HAS_DEEPSEEK_KEY == 'true'
        env:
          RUN_DEEPSEEK_TESTS: "1"
          COACH_DEEPSEEK_API_KEY: ${{ secrets.COACH_DEEPSEEK_API_KEY }}
        run: python -m pytest -q llm/rag/tests/llm/test_deepseek_smoke.py

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - python-tests
      - python-quality
      - dependency-security
      - docker-images
      - image-security
      - compose-validate
      - llm-regression
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Normalize image owner
        id: prep
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container image published for this release:
            - `ghcr.io/${{ steps.prep.outputs.owner }}/${{ env.API_IMAGE_NAME }}:${{ github.ref_name }}`
